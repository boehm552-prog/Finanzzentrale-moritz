<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finanzzentrale Moritz</title>

    manifest.json
    css/style.css

    https://cdn.jsdelivr.net/npm/@supabase/supabase-jsscript>
</head>

<body>

    <header>
        <h1>💰 Finanzzentrale</h1>
        <p>Deine Finanzen im Blick</p>
    </header>

    <main>

        <section class="card">
            <h2>Kontostand</h2>
            <h3 id="balance">0,00 €</h3>
        </section>

        <section class="grid">

            <div class="card">
                <h3>Einnahmen</h3>
                <p id="income">0 €</p>
            </div>

            <div class="card">
                <h3>Ausgaben</h3>
                <p id="expenses">0 €</p>
            </div>

        </section>

        <section class="grid">

            <button class="action-btn">
                ➕ Ausgabe
            </button>

            <button class="action-btn">
                💰 Einnahme
            </button>

            <button class="action-btn">
                🎯 Sparziele
            </button>

            <button class="action-btn">
                📊 Statistiken
            </button>

        </section>

    </main>

    js/config.jsscript>
    js/app.jsscript>

</body>
</html>
